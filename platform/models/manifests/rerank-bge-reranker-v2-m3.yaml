# Reranker (Architektur §6.3, ADR-3) – optional, hebt Retrieval-Präzision.
name: rerank
role: reranker
hf_repo: BAAI/bge-reranker-v2-m3
revision: main
license: Apache-2.0
languages: [multilingual]
serving:
  engine: vllm
  args:
    served-model-name: rerank
    task: score
    gpu-memory-utilization: 0.06
notes: >
  Cross-Encoder über die RRF-fusionierten Top-50 Kandidaten. Bei leerem
  RERANK_BASE_URL läuft die Plattform ohne Reranking (Dev-Modus).
