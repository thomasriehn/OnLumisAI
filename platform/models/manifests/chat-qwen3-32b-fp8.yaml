# Standard-Chat-LLM v1 (Architektur §6.3, Entscheidung offen bis PoC AP 1.9)
name: chat
role: chat-llm
hf_repo: Qwen/Qwen3-32B-FP8
revision: main
license: Apache-2.0
languages: [de, en]
serving:
  engine: vllm
  args:
    served-model-name: chat
    max-model-len: 16384
    gpu-memory-utilization: 0.55
    enable-lora: true
notes: >
  Sehr gute Deutsch-Qualität und RAG-Treue bei vertretbarem Speicherbedarf
  (~35 GB Gewichte FP8 + KV-Cache) auf DGX Spark (128 GB unified).
  Alternativen: openai/gpt-oss-120b (mehr Qualität, mehr RAM),
  mistralai/Mistral-Small-24B (schneller/sparsamer).
