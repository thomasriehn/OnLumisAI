# Transkription (Spracheingabe + Meeting-Mitschnitte) – lokal, DSGVO-konform
name: whisper
role: transcription
hf_repo: openai/whisper-large-v3-turbo
revision: main
license: MIT
languages: [de, multilingual]
serving:
  engine: vllm
  args:
    served-model-name: whisper
    task: transcription
    gpu-memory-utilization: 0.06
notes: >
  Bedient die Spracheingabe in Chat/Suche (/v1/transcriptions) und die
  Audio-Ingestion (Meeting-Aufnahmen in der Wissensbasis). Audio verlässt
  das Haus nie – deshalb bewusst kein Browser-Speech-API.
