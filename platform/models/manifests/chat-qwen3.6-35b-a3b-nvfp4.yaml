# Standard-Chat-LLM (NVFP4, Preset "standard" in deploy/setup-spark.sh)
name: chat
role: chat-llm
hf_repo: nvidia/Qwen3.6-35B-A3B-NVFP4
revision: main
license: siehe Modellkarte (Qwen-Lizenz, von NVIDIA quantisiert)
languages: [de, en, multilingual]
quantization: NVFP4 (TensorRT Model Optimizer, Blackwell-nativ)
serving:
  engine: vllm
  args:
    served-model-name: chat
    max-model-len: 16384
    gpu-memory-utilization: 0.55
    enable-lora: true
notes: >
  Von NVIDIA veröffentlichter NVFP4-Checkpoint. MoE mit ~3B aktiven
  Parametern je Token – auf der bandbreitenlimitierten Spark deutlich
  schneller als dichte Modelle vergleichbarer Qualität; meistgeladenes
  NVFP4-Modell auf Hugging Face (Stand Juli 2026). NVFP4 wird von vLLM
  automatisch aus der Checkpoint-Konfiguration erkannt.
