# OnLumis-Plattform – Basis-Stack (Produktion auf DGX Spark, aarch64)
#
# Start auf der Spark (inkl. Modell-Serving):
#   docker compose --profile models up -d
# Monitoring zusätzlich:
#   docker compose --profile models --profile monitoring up -d
#
# Entwicklung ohne GPU: compose.dev.yml als Override verwenden, siehe README.

name: onlumis

x-restart: &restart
  restart: unless-stopped

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  proxy:
    image: caddy:2-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
    environment:
      ONLUMIS_DOMAIN: ${ONLUMIS_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [webapp, api]

  webapp:
    build: ./services/webapp
    <<: *restart
    environment:
      API_BASE_URL: http://api:8000
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://${ONLUMIS_DOMAIN:-localhost}/auth/realms/onlumis}
      OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/onlumis
      OIDC_CLIENT_ID: onlumis-webapp
    networks: [edge, app]
    depends_on: [api]

  api:
    build: ./services/api
    <<: *restart
    environment:
      DATABASE_URL: postgresql://onlumis:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@postgres:5432/onlumis
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://${ONLUMIS_DOMAIN:-localhost}/auth/realms/onlumis}
      OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/onlumis
      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://vllm-chat:8001/v1}
      CHAT_MODEL: ${CHAT_MODEL_NAME:-chat}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-http://vllm-embed:8002/v1}
      EMBEDDINGS_MODEL: ${EMBED_MODEL_NAME:-embed}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://vllm-rerank:8003}
      RERANK_MODEL: ${RERANK_MODEL_NAME:-rerank}
      AUDIT_LOG_QUESTIONS: ${AUDIT_LOG_QUESTIONS:-false}
      RETENTION_DAYS_CONVERSATIONS: ${RETENTION_DAYS_CONVERSATIONS:-0}
      RETENTION_DAYS_AUDIT: ${RETENTION_DAYS_AUDIT:-0}
      MIN_RERANK_SCORE: ${MIN_RERANK_SCORE:-0.2}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-http://vllm-whisper:8005/v1}
    volumes:
      - ${SOURCES_PATH:-./data/sources}:/data/sources:ro
      - uploads:/data/uploads
    networks: [edge, app, data, ml]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: ./services/ingestion
      args:
        WITH_OCR: ${WITH_OCR:-0}
    <<: *restart
    environment:
      DATABASE_URL: postgresql://onlumis:${POSTGRES_PASSWORD:?}@postgres:5432/onlumis
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-http://vllm-embed:8002/v1}
      EMBEDDINGS_MODEL: ${EMBED_MODEL_NAME:-embed}
      RUN_MODE: loop
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      PARSING_BACKEND: ${PARSING_BACKEND:-simple}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-http://vllm-whisper:8005/v1}
    volumes:
      - ${SOURCES_PATH:-./data/sources}:/data/sources:ro
      - uploads:/data/uploads:ro
    networks: [app, data, ml]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    <<: *restart
    environment:
      POSTGRES_DB: onlumis
      POSTGRES_USER: onlumis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlumis -d onlumis"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    <<: *restart
    networks: [app]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    <<: *restart
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --http-relative-path=/auth
      - --import-realm
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://${ONLUMIS_DOMAIN:-localhost}/auth
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD in .env setzen}
    networks: [edge, app, data]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- Modelle
  # Nur mit --profile models (auf der Spark). Images: NGC-vLLM (aarch64+CUDA).

  vllm-chat:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:latest}
    <<: [*restart, *gpu]
    profiles: [models]
    command: >
      vllm serve ${CHAT_MODEL_ID:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      --served-model-name chat
      --host 0.0.0.0 --port 8001
      --gpu-memory-utilization ${CHAT_GPU_MEM_FRACTION:-0.55}
      --max-model-len ${CHAT_MAX_MODEL_LEN:-16384}
      --enable-lora
      ${CHAT_VLLM_EXTRA_ARGS:-}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: "16gb"
    networks: [ml]

  vllm-embed:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:latest}
    <<: [*restart, *gpu]
    profiles: [models]
    command: >
      vllm serve ${EMBED_MODEL_ID:-BAAI/bge-m3}
      --served-model-name embed
      --host 0.0.0.0 --port 8002
      --task embed
      --gpu-memory-utilization ${EMBED_GPU_MEM_FRACTION:-0.04}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks: [ml]

  vllm-rerank:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:latest}
    <<: [*restart, *gpu]
    profiles: [models]
    command: >
      vllm serve ${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      --served-model-name rerank
      --host 0.0.0.0 --port 8003
      --task score
      --gpu-memory-utilization ${RERANK_GPU_MEM_FRACTION:-0.04}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks: [ml]

  vllm-whisper:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:latest}
    <<: [*restart, *gpu]
    profiles: [models]
    command: >
      vllm serve ${WHISPER_MODEL_ID:-openai/whisper-large-v3-turbo}
      --served-model-name whisper
      --host 0.0.0.0 --port 8005
      --task transcription
      --gpu-memory-utilization ${WHISPER_GPU_MEM_FRACTION:-0.04}
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks: [ml]

  # ------------------------------------------------------------- Monitoring
  # Nur mit --profile monitoring.

  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: [app, ml]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-onlumis}
      GF_SERVER_ROOT_URL: https://${ONLUMIS_DOMAIN:-localhost}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    networks: [edge, app]

networks:
  edge:
  app:
  data:
  ml:

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  hf-cache:
  uploads:
  prom-data:
  grafana-data:
