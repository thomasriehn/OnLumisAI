# Air-Gap-Override (A8): Betrieb ohne jede Internetverbindung.
#
#   docker compose -f compose.yml -f compose.airgap.yml --profile models up -d
#
# Voraussetzung: Bundle wurde auf einer Online-Maschine erstellt und hier
# eingespielt (deploy/airgap/export-bundle.sh -> import-bundle.sh).
# Alle Images sind dann lokal geladen, der Modell-Cache ist gefüllt.

services:
  vllm-chat:
    pull_policy: never
    environment:
      HF_HUB_OFFLINE: "1"

  vllm-embed:
    pull_policy: never
    environment:
      HF_HUB_OFFLINE: "1"

  vllm-rerank:
    pull_policy: never
    environment:
      HF_HUB_OFFLINE: "1"

  vllm-whisper:
    pull_policy: never
    environment:
      HF_HUB_OFFLINE: "1"

  proxy:
    pull_policy: never
  postgres:
    pull_policy: never
  redis:
    pull_policy: never
  keycloak:
    pull_policy: never
